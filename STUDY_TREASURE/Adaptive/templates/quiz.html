<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Treasure | Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h2>Study Treasure</h2>
</header>

<main class="container">
    <section class="card">
        <div class="quiz-info">
            <span>Question {{ number }} of {{ total }}</span>
            <span class="difficulty">{{ question.difficulty }}</span>
        </div>

        <div class="progress">
            <div style="width: {{ number * 20 }}%;"></div>
        </div>

        <h2>{{ question.question }}</h2>

        <form action="/quiz" method="POST" id="answerForm">
            <input type="hidden" name="elapsed" id="elapsed" value="0">

            <label class="option">
                <input type="radio" name="answer" value="A" required>
                {{ question.option_a }}
            </label>

            <label class="option">
                <input type="radio" name="answer" value="B">
                {{ question.option_b }}
            </label>

            <label class="option">
                <input type="radio" name="answer" value="C">
                {{ question.option_c }}
            </label>

            <label class="option">
                <input type="radio" name="answer" value="D">
                {{ question.option_d }}
            </label>

            <button type="submit">Submit Answer</button>
        </form>

        <p class="muted">Answer carefully. Your response time helps measure performance.</p>
    </section>
</main>

<script>
const startTime = Date.now();
const form = document.getElementById("answerForm");

form.addEventListener("submit", function() {
    const elapsedSeconds = (Date.now() - startTime) / 1000;
    document.getElementById("elapsed").value = elapsedSeconds.toFixed(1);
});
</script>

</body>
</html>
