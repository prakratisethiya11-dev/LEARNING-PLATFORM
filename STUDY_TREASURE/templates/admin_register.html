<!DOCTYPE html>
<html>
<head>
    <title>Admin Registration - Study Treasure</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <div class="register-box">
        <h2>Admin Registration</h2>
        <p>Create an administrator account</p>

        <form>
            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name" required>

            <label>Admin ID</label>
            <input type="text" placeholder="Enter your admin ID" required>

            <label>Email</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Admin Access Code</label>
            <input type="password" placeholder="Enter authorized access code" required>

            <label>Password</label>
            <input type="password" placeholder="Create a password" required>

            <label>Confirm Password</label>
            <input type="password" placeholder="Confirm your password" required>

            <button type="submit">Register</button>
        </form>

        <p><a href="index.html">Back to Home</a></p>
    </div>

</body>
</html>
